<html lang="ja">
<head>
<meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, maximum-scale=1.0, user-scalable=yes">
<title>空き状況確認</title>
<style>
body {
  -webkit-text-size-adjust: 100%;
}

ul {
  padding-left: 0;
}
li {
  list-style: none;
}
</style>
</head>
<body>
<div id="export"></div>
<script src="holiday_jp.min.js"></script>
<script>
window.onload = async () => {
  const days = ['(日)', '(月)', '(火)', '(水)', '(木)', '(金)', '(土)'];
  const exportJson = document.getElementById('export');

  const apptSysIds = {
    //
    'af1fde809329d210f66d3cc97bba1029': '%E6%98%8E%E6%B2%BB%E5%B8%82%E6%B0%91%E3%82%BB%E3%83%B3%E3%82%BF%E3%83%BC_%E6%B9%98%E5%8D%97%E3%83%A6%E3%83%8A%E3%82%A4%E3%83%86%E3%83%83%E3%83%89%EF%BC%A2%EF%BC%A3%E4%BD%93%E8%82%B2%E5%AE%A4',
    //
    'f95d5ecc93e5d210f66d3cc97bba10a4': '%E8%BE%BB%E5%A0%82%E5%B8%82%E6%B0%91%E3%82%BB%E3%83%B3%E3%82%BF%E3%83%BC_%E3%82%B5%E3%83%B3%E3%82%AD%E3%83%9B%E3%83%BC%E3%83%A0%E4%BD%93%E8%82%B2%E5%AE%A4',
    //
    'fd587acf2b865250b835fd80de91bfb2': '%E7%A7%A9%E7%88%B6%E5%AE%AE%E8%A8%98%E5%BF%B5%E4%BD%93%E8%82%B2%E9%A4%A8_1%2F4%E3%83%A1%E3%82%A4%E3%83%B3%E3%82%A2%E3%83%AA%E3%83%BC%E3%83%8A%E2%91%A0',
    '2e58b6032bc65250b835fd80de91bf39': '%E7%A7%A9%E7%88%B6%E5%AE%AE%E8%A8%98%E5%BF%B5%E4%BD%93%E8%82%B2%E9%A4%A8_1%2F4%E3%83%A1%E3%82%A4%E3%83%B3%E3%82%A2%E3%83%AA%E3%83%BC%E3%83%8A%E2%91%A1',
    '0f58b6032bc65250b835fd80de91bfd0': '%E7%A7%A9%E7%88%B6%E5%AE%AE%E8%A8%98%E5%BF%B5%E4%BD%93%E8%82%B2%E9%A4%A8_1%2F4%E3%83%A1%E3%82%A4%E3%83%B3%E3%82%A2%E3%83%AA%E3%83%BC%E3%83%8A%E2%91%A2',
    'af58f6032bc65250b835fd80de91bf4e': '%E7%A7%A9%E7%88%B6%E5%AE%AE%E8%A8%98%E5%BF%B5%E4%BD%93%E8%82%B2%E9%A4%A8_1%2F4%E3%83%A1%E3%82%A4%E3%83%B3%E3%82%A2%E3%83%AA%E3%83%BC%E3%83%8A%E2%91%A3',
    '50331c684777c2506ac2f25f016d4328': '%E7%A7%A9%E7%88%B6%E5%AE%AE%E8%A8%98%E5%BF%B5%E4%BD%93%E8%82%B2%E9%A4%A8_%E3%82%B5%E3%83%96%E3%82%A2%E3%83%AA%E3%83%BC%E3%83%8A',
  };
  const select = document.createElement('select');
  {
    exportJson.appendChild(select);
    for (const apptSysId in apptSysIds) {
      const option = document.createElement('option');
      option.setAttribute('value', apptSysId);
      option.textContent = decodeURIComponent(apptSysIds[apptSysId]);
      select.appendChild(option);
    }
    select.addEventListener('change', e => {
      const apptSysId = e.target.value;
      for (const apptSysId in apptSysIds)
        document.getElementById(apptSysId).style.display = 'none';
      document.getElementById(apptSysId).style.display = '';
      localStorage.setItem('selected', apptSysId);
    });
    const hr = document.createElement('hr');
    exportJson.appendChild(hr);
  }
  for (const apptSysId in apptSysIds) {
    const p = document.createElement('p');
    p.setAttribute('id', apptSysId);
    p.style.display = 'none';
    exportJson.appendChild(p);
    const heading = document.createElement('h3');
    const a = document.createElement('a');
    a.setAttribute('href', `https://fujisawacity.service-now.com/facilities_reservation?id=fr_slot_check&appt_sys_id=${apptSysId}`);
    a.setAttribute('target', '_blank');
    a.textContent = decodeURIComponent(apptSysIds[apptSysId]);
    heading.appendChild(a);
    p.appendChild(heading);
    try {
      const res = await fetch(`${apptSysId}.json`, {
        method: 'GET',
      });
      const json = await res.json();

      const slots = json.slots;
      sorted = Object.keys(slots);
      sorted.sort();
      const ul = document.createElement('ul');
      for (const key of sorted) {
        const li = document.createElement('li');
        const startDate = new Date(slots[key].start);
        const text = `${startDate.toLocaleDateString('ja-JP')} ${days[startDate.getDay()]} ${startDate.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`;
        if (startDate.getDay() == 4 && startDate.getHours() == 17) {
          li.innerHTML = `<font color="red">${text}</font>`;
        } else if ([0, 6].includes(startDate.getDay()) || holiday_jp.isHoliday(startDate) || startDate.getHours() >= 17) {
          li.innerHTML = text;
        } else {
          li.innerHTML = `<font color="gray">${text}</font>`;
        }
        ul.appendChild(li);
      }
      p.appendChild(ul);

      const lastUpdateDate = new Date(json.lastUpdate);
      const lastUpdate = document.createElement('div');
      lastUpdate.innerHTML = `<small>最終更新日時: ${lastUpdateDate.toLocaleString('ja-JP')}</small>`;
      p.appendChild(lastUpdate);
    } catch (e) {
      const error = document.createElement('div');
      error.innerHTML = `<font color="red">${e.toString()}</font>`
    }
  }
  {
    const apptSysId = localStorage.getItem('selected');
    if (apptSysId != null && Object.keys(apptSysIds).includes(apptSysId))
      select.value = apptSysId;
    select.dispatchEvent(new Event('change'));
  }
}
</script>
</body>
</html>
